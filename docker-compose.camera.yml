services:
  camera-stream:
    build:
      context: .
      dockerfile: docker/camera/Dockerfile
    platform: linux/arm64
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true
    env_file:
      - ./docker/.env
    environment:
      - CYCLONEDDS_URI=file:///dds/cyclonedds_robot.xml
      - HOME=/tmp
      - UDEV=1
    volumes:
      - ./dds/cyclonedds_robot.xml:/dds/cyclonedds_robot.xml
      - /dev:/dev  
      - /run/udev:/run/udev:ro
    group_add:
      - "video"
    command: ros2 run camera_stream camera_node