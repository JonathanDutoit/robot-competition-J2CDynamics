services:
  ros2-robot:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: robot
      args:
        BUILDPLATFORM: linux/arm64
    platform: linux/arm64
    
    env_file:
      - ./docker/.env

    environment:
      - CYCLONEDDS_URI=file:///dds/cyclonedds_robot.xml

    volumes:
      - ./ros2_ws/src:/ros2_ws/src 
      - ./dds/cyclonedds_robot.xml:/dds/cyclonedds_robot.xml

    devices:
      - /dev/serial/by-id/usb-Arduino__www.arduino.cc__0043_ABC123-if00:/dev/arduino
      - /dev/serial/by-id/usb-SLAMTEC_RPLIDAR_A1_DEF456-if00:/dev/lidar

    command: >
      bash -c "

      " 

    group_add:
    # Owner group of /dev/ttyUSB0
      - "dialout" 