services:
  driver:
    build:
      context: .
      dockerfile: docker/driver/Dockerfile
      args:
        BUILDPLATFORM: linux/arm64

    network_mode: host
    platform: linux/arm64

    environment:
      - ROBOT_NAME=${ROBOT_NAME}
      - ROBOT_DESCRIPTION=${ROBOT_DESCRIPTION}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI}

    volumes:
      - ./dds/cyclonedds_robot.xml:/dds/cyclonedds_robot.xml
      - /dev:/dev
      - ./ros2_ws/src/j2cdynamics_bringup:/ros2_ws/src/j2cdynamics_bringup
      - ./ros2_ws/src/j2cdynamics_driver:/ros2_ws/src/j2cdynamics_driver
      - ./ros2_ws/src/j2cdynamics_diagnostics:/ros2_ws/src/j2cdynamics_diagnostics
      - ./ros2_ws/src/${ROBOT_DESCRIPTION}:/ros2_ws/src/${ROBOT_DESCRIPTION}

    devices:
      - /dev/serial:/dev/serial

    group_add:
      - "dialout"

    privileged: true

    command: >
      ros2 launch j2cdynamics_bringup driver.launch.py
      robot_name:=${ROBOT_NAME}

    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/humble/setup.sh && ros2 topic list | grep -q '^/odom$'"]
      interval: 5s
      timeout: 5s
      retries: 10


  camera:
    build:
      context: .
      dockerfile: docker/camera/Dockerfile

    network_mode: host
    platform: linux/arm64
    privileged: true
    stdin_open: true
    tty: true

    environment:
      - CAMERA_CALIBRATION=${CAMERA_CALIBRATION}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI}
      - HOME=/tmp
      - UDEV=1

    volumes:
      - ./dds/cyclonedds_robot.xml:/dds/cyclonedds_robot.xml
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./ros2_ws/src/j2cdynamics_bringup:/ros2_ws/src/j2cdynamics_bringup
      - ./ros2_ws/src/j2cdynamics_camera:/ros2_ws/src/j2cdynamics_camera
      - ./ros2_ws/src/j2cdynamics_perception:/ros2_ws/src/j2cdynamics_perception
      - ./camera/model/best_int8.onnx:/ros2_ws/model/best_int8.onnx
      - ./ros2_ws/src/j2cdynamics_perception/config:/calibration_files/

    group_add:
      - "video"

    depends_on:
      driver:
        condition: service_healthy
      lidar:
        condition: service_healthy
      navigation:
        condition: service_healthy

    command: >
      ros2 launch j2cdynamics_bringup camera.launch.py
      calibration_file:=${CAMERA_CALIBRATION}


  lidar:
    build:
      context: .
      dockerfile: docker/lidar/Dockerfile

    network_mode: host
    platform: linux/arm64
    privileged: true

    environment:
      - CYCLONEDDS_URI=${CYCLONEDDS_URI}

    volumes:
      - ./dds/cyclonedds_robot.xml:/dds/cyclonedds_robot.xml
      - /dev:/dev
      - ./ros2_ws/src/j2cdynamics_bringup:/ros2_ws/src/j2cdynamics_bringup

    command: ros2 launch j2cdynamics_bringup lidar.launch.py

    healthcheck:
      test: ["CMD-SHELL", ". /opt/ros/humble/setup.sh && ros2 topic list | grep -q '^/scan$'"]
      interval: 5s
      timeout: 5s
      retries: 10


  navigation:
    build:
      context: .
      dockerfile: docker/navigation/Dockerfile

    network_mode: host
    platform: linux/arm64
    privileged: true

    environment:
      - AMCL_PARAMS=${AMCL_PARAMS}
      - NAV2_PARAMS=${NAV2_PARAMS}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI}

    volumes:
      - ./dds/cyclonedds_robot.xml:/dds/cyclonedds_robot.xml
      - /dev:/dev
      - ./ros2_ws/src/j2cdynamics_bringup:/ros2_ws/src/j2cdynamics_bringup
      - ./ros2_ws/src/j2cdynamics_bringup/maps:/maps

    devices:
      - /dev/input/js0:/dev/input/js0

    depends_on:
      lidar:
        condition: service_healthy
      driver:
        condition: service_healthy

    command: >
      ros2 launch j2cdynamics_bringup robot.launch.py
      use_teleop:=true
      mode:=localization
      map:=/maps/arena/map
      amcl_yaml:=${AMCL_PARAMS}
      nav2_yaml:=${NAV2_PARAMS}


  mission:
    build:
      context: .
      dockerfile: docker/navigation/Dockerfile

    network_mode: host
    platform: linux/arm64
    privileged: true

    environment:
      - ROBOT_NAME=${ROBOT_NAME}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI}

    volumes:
      - ./dds/cyclonedds_robot.xml:/dds/cyclonedds_robot.xml
      - ./ros2_ws/src/j2cdynamics_bringup:/ros2_ws/src/j2cdynamics_bringup
      - ./ros2_ws/src/j2cdynamics_mission:/ros2_ws/src/j2cdynamics_mission
      - ./ros2_ws/src/j2cdynamics_bringup/maps:/maps

    depends_on:
      navigation:
        condition: service_healthy

    command: ros2 launch j2cdynamics_bringup ${ROBOT_NAME}_mission.launch.py


  simulation:
    build:
      context: .
      dockerfile: simulation/docker/Dockerfile

    platform: linux/amd64
    volumes:
      - ./ros2_ws:/home/ubuntu/ros2_ws
    ports:
      - "6080:80"
    shm_size: 512m
    security_opt:
      - seccomp=unconfined
    profiles:
      - manual