teleop_twist_joy_node:
  ros__parameters:

    # ─────────────────────────────
    # DEADMAN / ENABLE
    # ─────────────────────────────
    enable_button: 5          # RB (common Xbox mapping)
    enable_turbo_button: 4   # LB (optional turbo hold)

    # ─────────────────────────────
    # AXES MAPPING
    # ─────────────────────────────
    axis_linear.x: 1         # left stick vertical
    axis_angular.yaw: 0      # left stick horizontal

    # ─────────────────────────────
    # SCALING
    # ─────────────────────────────
    scale_linear.x: 0.6
    scale_linear_turbo.x: 1.2

    scale_angular.yaw: 1.0
    scale_angular_turbo.yaw: 1.8

    # ─────────────────────────────
    # BEHAVIOR
    # ─────────────────────────────
    require_enable_button: true
    publish_stamped_twist: false
