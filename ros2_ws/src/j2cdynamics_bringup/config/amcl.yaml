amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    min_particles: 500       # was 1000 — adaptive MCL will use more when needed
    max_particles: 2500      # was 5000 — easier on the Pi
    pf_err: 0.05
    pf_z: 0.99

    alpha1: 0.15             # was 0.20 — rotation-from-rotation, modest
    alpha2: 0.25             # was 0.60 — this was the big one
    alpha3: 0.30             # was 0.20 — translation-from-translation, bumped to absorb tacho scale bias
    alpha4: 0.15             # was 0.20
    alpha5: 0.20

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    max_beams: 60
    sigma_hit: 0.15          # was 0.10 — wider peaks pair better with larger motion noise
    z_hit: 0.85
    z_rand: 0.10
    z_short: 0.025
    z_max: 0.025

    update_min_d: 0.20       # was 0.15 — slightly fewer updates, less CPU thrash
    update_min_a: 0.15       # was 0.10
    resample_interval: 1
    transform_tolerance: 0.2 # was 0.5 — was masking staleness downstream

    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    save_pose_rate: 0.5
    tf_broadcast: true

    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 1.25
      y: 0.4
      z: 0.0
      yaw: 0.02