# ─────────────────────────────────────────────────────────────────────────────
# AMCL — Adaptive Monte Carlo Localization against a static map_server map.
# Replaces slam_toolbox localization mode. Tuned for OPEN-LOOP, noisy odometry:
# the motion-model noise (alpha1..4) is raised so the filter leans on the laser
# rather than trusting the wheel odometry prior.
# ─────────────────────────────────────────────────────────────────────────────
amcl:
  ros__parameters:
    use_sim_time: false

    # ── Frames / topics ──────────────────────────────────────────────────────
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # ── Particle filter ──────────────────────────────────────────────────────
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    # ── Motion model noise ───────────────────────────────────────────────────
    # Tuned to spread particles enough for laser correction without making the
    # filter jittery. Alpha3/4 are lowered to reduce translational drift.
    alpha1: 0.2    # rotation noise from rotation
    alpha2: 0.2    # rotation noise from translation
    alpha3: 0.15   # translation noise from translation
    alpha4: 0.1    # translation noise from rotation
    alpha5: 0.2    # (omni model only; harmless for differential)

    # ── Laser likelihood-field model ─────────────────────────────────────────
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    max_beams: 60

    # Heavily favour the correct match – sharpens the pose cloud dramatically.
    z_hit: 0.95
    z_rand: 0.05
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.2

    # ── Update / resample thresholds ─────────────────────────────────────────
    update_min_d: 0.15          # m — slightly tighter for earlier position updates
    update_min_a: 0.10          # rad (~5.7°) — better angular tracking
    resample_interval: 1
    transform_tolerance: 0.5    # s — reduced from 1.0 to match odom latency

    # ── Kidnapped-robot recovery ─────────────────────────────────────────────
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.05   # lowered from 0.1 to reduce spurious injections

    save_pose_rate: 0.5
    tf_broadcast: true

    # ── Initial pose (override per run via RViz "2D Pose Estimate") ──────────
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 4.255
      y: 5.228
      z: 0.0
      yaw: 1.50