# ─────────────────────────────────────────────────────────────────────────────
# Nav2 parameter file for a differential-drive robot.
# Local planner: DWB (DynamicWindowApproach)
# ─────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Absolute path is injected at launch by RewrittenYaml in navigation.launch.py
    # (points to j2cdynamics_bringup/behavior_trees/navigate_to_pose_no_recovery.xml)
    default_nav_to_pose_bt_xml: "$(find-pkg-share j2cdynamics_bringup)/behavior_trees/navigate_to_pose_no_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ── Controller server (DWB local planner) ────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0       # Hz — lower for slow/embedded hardware
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "precise_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5  # m — if robot doesn't move this far in time, recovery triggers
      movement_time_allowance: 10.0  # s

    # ── general: PATROL — position only (default). Selected when no goal-checker
    #    selection is published, so patrol stops on arrival with no in-place spin.
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 3.14   # 3.14 rad ⇒ any heading satisfies the goal (ignored)

    # ── precise: RAMP APPROACH — enforce heading. Selected per-goal by the mission
    #    runner via the /goal_checker_selector topic (GoalCheckerSelector in the BT).
    precise_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.10   # ~5.7° — tune vs. the 2 cm ramp margin

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # ── Kinematic limits ─────────────────────────────────────────────────
      min_vel_x:   0.0
      min_vel_y:   0.0              # 0 for differential drive (no lateral motion)
      max_vel_x:   0.30             # m/s  (raised from 0.195; HW can do ~0.66, capped for LIDAR/AMCL)
      max_vel_y:   0.0              # m/s  — 0 for differential drive
      max_vel_theta: 0.85           # rad/s — ceiling ~0.94 rad/s;  backed off for trailer stability
      min_speed_xy:  0.0
      max_speed_xy:  0.30           # m/s  (must match max_vel_x)
      min_speed_theta: 0.0
      acc_lim_x:   0.7              # m/s² — bumped so the higher top speed is actually reached
      acc_lim_y:   0.0
      acc_lim_theta: 1.5            # rad/s²
      decel_lim_x: -0.7
      decel_lim_y:  0.0
      decel_lim_theta: -1.5

      # ── Trajectory sampling ──────────────────────────────────────────────
      vx_samples:    20
      vy_samples:    1
      vtheta_samples: 20
      sim_time:       1.7            # s — how far ahead to simulate trajectories
      linear_granularity:  0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      # ── DWB critics (scoring functions) ─────────────────────────────────
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale:  0.02
      PathAlign.scale:     32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale:     24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale:      32.0
      GoalDist.scale:      24.0
      RotateToGoal.scale:  32.0
      RotateToGoal.slowing_factor: 5.0     # higher ⇒ decelerate harder into the goal
      RotateToGoal.lookahead_time: -1.0    #          heading so it settles, not overshoots

# ── Smoother server ───────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ── Planner server (global planner) ──────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"  # A* / Dijkstra global planner
      tolerance: 0.5        # m — how close to the goal the plan needs to get
      use_astar: true       # false = Dijkstra
      allow_unknown: true   # allow planning through unexplored space

# ── Behaviour server (recovery behaviours) ───────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic:  local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Recovery behaviours stripped. The no-recovery BT
    # (navigate_to_pose_no_recovery.xml) never calls Spin/BackUp/Wait/
    # DriveOnHeading, so no behaviour plugins are loaded and the robot can never
    # spin or wait autonomously — the symptom both prior teams removed. The
    # behavior_server is also dropped from the lifecycle manager below, so this
    # node is launched but stays dormant.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
  
    local_frame:  odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ── Waypoint follower ─────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200   # ms to pause at each waypoint

# ── Velocity smoother ─────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity:     [ 0.30,  0.0,  0.85]   # [vx, vy, vtheta]  (match DWB max_vel_x)
    min_velocity:     [-0.30,  0.0, -0.85]
    max_accel:        [ 0.7,  0.0,  1.5]
    max_decel:        [-0.7,  0.0, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ── Local costmap ─────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency:   5.0    # Hz
      publish_frequency:  2.0    # Hz
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width:      3              # m — size of the local costmap window
      height:     3              # m
      resolution: 0.05           # m/cell
      # Base link length 204 + trailer length 180 (204 + 180) / 2 = 19.2. Base link width = 460 
      footprint: "[[0.192,  0.230], [ 0.192, -0.230], [-0.192, -0.230], [-0.192,  0.230]]"
      plugins:
        - voxel_layer
        - inflation_layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25   # m - 23 robot radius + 2cm margin that sums to 50cm
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.5
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range:  8.0
          raytrace_min_range:  0.0
          obstacle_max_range:  5.0
          obstacle_min_range:  0.0
      always_send_full_costmap: true
 
# ── Global costmap ────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency:   1.0    # Hz — global map updates slowly
      publish_frequency:  1.0    # Hz
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.192,  0.230], [ 0.192, -0.230], [-0.192, -0.230], [-0.192,  0.230]]"
      resolution: 0.05
      track_unknown_space: true
      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.5
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range:  8.0
          raytrace_min_range:  0.0
          obstacle_max_range:  5.0
          obstacle_min_range:  0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25   # m - 23 robot radius + 2cm margin that sums to 50cm
      # Keepout zones — danger areas painted black into map_keepout.pgm. Fed by
      # filter_mask_server + costmap_filter_info_server (launched in localization
      # mode). With the default all-free mask this adds zero cost.
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      always_send_full_costmap: true

# ── Localization & keepout servers ────────────────────────────────────────────
# AMCL + map_server now run as their own launch nodes (see amcl.yaml and
# navigation.launch.py). The keepout filter servers (filter_mask_server +
# costmap_filter_info_server) are also launched there; the KeepoutFilter above
# subscribes to the /costmap_filter_info they publish.

# ── Lifecycle manager ─────────────────────────────────────────────────────────
# NOTE: this block is NOT used by nav2_bringup — its navigation_launch.py starts a
# manager named 'lifecycle_manager_navigation' with its own hard-coded node list
# (which includes behavior_server). Kept here only for reference / standalone use.
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother