# nav2_params.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Nav2 parameter file for a differential-drive robot.
# Local planner: DWB (DynamicWindowApproach)
#
# REQUIRED: Search for every TODO comment and fill in your robot's values.
# ─────────────────────────────────────────────────────────────────────────────

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    #default_nav_to_pose_bt_xml: "/opt/anaconda3/envs/ros2_sim/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    #default_nav_through_poses_bt_xml: "/opt/anaconda3/envs/ros2_sim/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

# ── Controller server (DWB local planner) ────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0       # Hz — lower for slow/embedded hardware
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5  # m — if robot doesn't move this far in time, recovery triggers
      movement_time_allowance: 10.0  # s

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15        # m  — TODO: tighten once odometry is calibrated
      yaw_goal_tolerance: 0.15       # rad

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # ── Kinematic limits ─────────────────────────────────────────────────
      # TODO: Set these to your robot's actual maximum velocities / accelerations
      min_vel_x:   0.0
      min_vel_y:   0.0              # 0 for differential drive (no lateral motion)
      max_vel_x:   0.3              # m/s  — TODO adjust
      max_vel_y:   0.0              # m/s  — 0 for differential drive
      max_vel_theta: 1.0            # rad/s — TODO adjust
      min_speed_xy:  0.0
      max_speed_xy:  0.3            # m/s
      min_speed_theta: 0.0
      acc_lim_x:   1.0              # m/s² — TODO adjust
      acc_lim_y:   0.0
      acc_lim_theta: 2.0            # rad/s² — TODO adjust
      decel_lim_x: -1.0
      decel_lim_y:  0.0
      decel_lim_theta: -2.0

      # ── Trajectory sampling ──────────────────────────────────────────────
      vx_samples:    20
      vy_samples:    5
      vtheta_samples: 20
      sim_time:       1.7            # s — how far ahead to simulate trajectories
      linear_granularity:  0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true

      # ── DWB critics (scoring functions) ─────────────────────────────────
      critics:
        - RotateToGoal
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale:  0.02
      PathAlign.scale:     32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale:     24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale:      32.0
      GoalDist.scale:      24.0
      RotateToGoal.scale:  32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ── Smoother server ───────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ── Planner server (global planner) ──────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"  # A* / Dijkstra global planner
      tolerance: 0.5        # m — how close to the goal the plan needs to get
      use_astar: true       # false = Dijkstra
      allow_unknown: true   # allow planning through unexplored space

# ── Behaviour server (recovery behaviours) ───────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic:  local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic:  local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - assisted_teleop
      - wait
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    # Kinematic limits reused for recovery behaviours
    # TODO: match these to your robot's actual limits
    local_frame:  odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ── Waypoint follower ─────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200   # ms to pause at each waypoint

# ── Velocity smoother ─────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # TODO: match to your robot's actual limits
    max_velocity:     [ 0.3,  0.0,  1.0]   # [vx, vy, vtheta]
    min_velocity:     [-0.3,  0.0, -1.0]
    max_accel:        [ 1.0,  0.0,  2.0]
    max_decel:        [-1.0,  0.0, -2.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ── Local costmap ─────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency:   5.0    # Hz
      publish_frequency:  2.0    # Hz
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width:      3              # m — size of the local costmap window
      height:     3              # m
      resolution: 0.05           # m/cell
      # TODO: replace with your robot's actual footprint [x, y] pairs (metres)
      # This is a 30 cm × 30 cm square placeholder — measure your robot!
      footprint: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      plugins:
        - voxel_layer
        - inflation_layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35   # m — TODO: set to at least robot_radius + safety margin
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range:  3.0
          raytrace_min_range:  0.0
          obstacle_max_range:  2.5
          obstacle_min_range:  0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

# ── Global costmap ────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency:   1.0    # Hz — global map updates slowly
      publish_frequency:  1.0    # Hz
      global_frame: map
      robot_base_frame: base_link
      # TODO: replace with your robot's actual footprint (same as local costmap)
      footprint: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      resolution: 0.05
      track_unknown_space: true
      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range:  3.0
          raytrace_min_range:  0.0
          obstacle_max_range:  2.5
          obstacle_min_range:  0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35   # m — TODO: match local costmap value
      always_send_full_costmap: true

# ── Map server & AMCL (not used — slam_toolbox handles localisation) ──────────
# map_server and amcl are intentionally omitted.
# slam_toolbox in localization mode publishes the map → odom TF directly.

# ── Lifecycle manager ─────────────────────────────────────────────────────────
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother